name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Run test coverage
        run: pnpm run test:coverage

      - name: Build site and Studio
        run: pnpm run build:all
        env:
          NODE_ENV: production
          # Public values (also in studio/sanity.config.ts); no secrets needed to build.
          VITE_SANITY_PROJECT_ID: w696z6zz
          VITE_SANITY_DATASET: portfolio-thaiseboy
          VITE_SANITY_API_VERSION: '2023-01-01'

  build-info:
    name: Build Information
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const branchName = context.payload.pull_request.head.ref;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Deployment Preview

              Branch: \`${branchName}\`

              **Netlify** will automatically deploy a preview for this PR.
              Check the Netlify bot comment below for the preview URL.

              ---
              ✅ CI Pipeline passed - Ready for review!`
            });
