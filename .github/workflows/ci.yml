name: CI Pipeline

# Runs once per pull request push and once per push to main; feature branches
# without a PR do not trigger a run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR or branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Uses the pnpm version from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      # Vitest runs once (not in watch mode) because GitHub sets CI=true.
      - name: Run tests
        run: pnpm run test

      - name: Build site and Studio
        run: pnpm run build:all
        env:
          NODE_ENV: production
          # Public values (also in studio/sanity.config.ts); no secrets needed to build.
          VITE_SANITY_PROJECT_ID: w696z6zz
          VITE_SANITY_DATASET: portfolio-thaiseboy
          VITE_SANITY_API_VERSION: "2023-01-01"
